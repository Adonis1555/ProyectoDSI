{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="{% static 'styles/login.css' %}">
    <title>Login</title>
    <style>
        .password-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .password-wrapper .loginInput {
            width: 100%;
            padding-right: 42px; /* Espacio para no escribir encima del botón */
            box-sizing: border-box;
        }

        .btn-toggle-password {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            transition: color 0.2s ease;
        }

        .btn-toggle-password:hover {
            color: #1e293b;
        }

        .btn-toggle-password:focus {
            outline: none;
        }

        .btn-toggle-password svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    {% if messages %}
        <div class="toast-container">
            {% for message in messages %}
                <div class="toast-card">
                    <button type="button" class="toast-close-btn" aria-label="Cerrar">&times;</button>
                    <div class="toast-content">
                        <p class="toast-text">{{ message }}</p>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <form method="POST" action="">
        {% csrf_token %}
        <div class="Card-Login">
            <div class="imgContainer">
                <img class="Logo" src="{% static 'logo.jpg' %}" alt="Logo">
            </div>
            
            <div class="inputsContainer">
                <input type="text" class="loginInput {% if messages %}input-error{% endif %}" name="Usuario" placeholder="Usuario" required> 
                
                <div class="password-wrapper">
                    <input type="password" id="passwordInput" class="loginInput {% if messages %}input-error{% endif %}" name="Password" placeholder="Contraseña" required>
                    <button type="button" id="togglePasswordBtn" class="btn-toggle-password" aria-label="Mostrar u ocultar contraseña">
                        <!-- Ícono Ojo Cerrado / Oculto por defecto -->
                        <svg id="iconEyeClosed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                        <!-- Ícono Ojo Abierto / Visible -->
                        <svg id="iconEyeOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <button class="loginButton" type="submit">Iniciar Sesión</button>
                <a class="registrarseLink" href="{% url 'registro_responsable' %}">Regístrate</a>
            </div>
        </div>
    </form>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // 1. Toast notifications
            const toast = document.querySelector('.toast-card');
            if (toast) {
                const hideToast = () => {
                    toast.classList.add('hide');
                    setTimeout(() => toast.remove(), 500);
                };
    
                const autoHideTimer = setTimeout(hideToast, 4000);
    
                const closeBtn = toast.querySelector('.toast-close-btn');
                if (closeBtn) {
                    closeBtn.addEventListener('click', function() {
                        clearTimeout(autoHideTimer); 
                        hideToast();
                    });
                }
            }

            // 2. Toggle visibilidad de contraseña
            const passwordInput = document.getElementById('passwordInput');
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const iconEyeOpen = document.getElementById('iconEyeOpen');
            const iconEyeClosed = document.getElementById('iconEyeClosed');

            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', function() {
                    const isPassword = passwordInput.getAttribute('type') === 'password';
                    
                    if (isPassword) {
                        passwordInput.setAttribute('type', 'text');
                        iconEyeOpen.style.display = 'block';
                        iconEyeClosed.style.display = 'none';
                    } else {
                        passwordInput.setAttribute('type', 'password');
                        iconEyeOpen.style.display = 'none';
                        iconEyeClosed.style.display = 'block';
                    }
                });
            }
        });
    </script>
</body>
</html>
