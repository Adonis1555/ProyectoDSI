{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'styles/login.css' %}">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <title>Registro de Responsable</title>
    <style>
        .password-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
        }

        .password-wrapper .loginInput {
            width: 100%;
            padding-right: 42px;
            box-sizing: border-box;
        }

        .btn-toggle-password {
            position: absolute;
            right: 12px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            transition: color 0.2s ease;
        }

        .btn-toggle-password:hover {
            color: #1e293b;
        }

        .btn-toggle-password:focus {
            outline: none;
        }

        .btn-toggle-password svg {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>

    <form id="formRegistro" method="POST" action="">
        {% csrf_token %}
        <div class="Card-Login Card-Registro">
            <div class="imgContainer">
                <img class="Logo" src="{% static 'logo.jpg' %}" alt="Logo">
            </div>

            <h2 class="form-title">Registro de Responsable</h2>
            
            <div class="inputsContainer">
                
                <div class="form-row">
                    <div class="input-group">
                        <label class="input-label">Nombres</label>
                        <input type="text" class="loginInput" name="nombre" placeholder="Nombres" required>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Apellidos</label>
                        <input type="text" class="loginInput" name="apellido" placeholder="Apellidos" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label class="input-label">DUI (00000000-0)</label>
                        <input type="text" class="loginInput" name="dui" placeholder="00000000-0" maxlength="10" required>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Teléfono</label>
                        <input type="text" class="loginInput" name="telefono" placeholder="7000-0000" maxlength="9" required>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label">Correo electrónico</label>
                    <input type="email" class="loginInput" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-row">
                    <!-- Campo Contraseña -->
                    <div class="input-group">
                        <label class="input-label">Contraseña</label>
                        <div class="password-wrapper">
                            <input type="password" id="inputPassword" class="loginInput" name="password" placeholder="••••••••" required>
                            <button type="button" class="btn-toggle-password" data-target="inputPassword" aria-label="Mostrar u ocultar contraseña">
                                <svg class="icon-eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                                <svg class="icon-eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Campo Confirmar Contraseña -->
                    <div class="input-group">
                        <label class="input-label">Confirmar Contraseña</label>
                        <div class="password-wrapper">
                            <input type="password" id="inputPasswordConfirm" class="loginInput" name="password_confirm" placeholder="••••••••" required>
                            <button type="button" class="btn-toggle-password" data-target="inputPasswordConfirm" aria-label="Mostrar u ocultar confirmación de contraseña">
                                <svg class="icon-eye-closed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                                <svg class="icon-eye-open" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <button class="loginButton" type="submit" style="margin-top: 10px;">Registrarme</button>
                <a class="registrarseLink" href="{% url 'login' %}">¿Ya tienes cuenta? Inicia sesión</a>

            </div>
        </div>
    </form>

    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const form = document.getElementById('formRegistro');
            const inputDui = document.querySelector('input[name="dui"]');
            const inputTelefono = document.querySelector('input[name="telefono"]');

            // 1. Toggle interactivo para ojitos de contraseñas
            document.querySelectorAll('.btn-toggle-password').forEach(button => {
                button.addEventListener('click', function() {
                    const targetId = this.getAttribute('data-target');
                    const targetInput = document.getElementById(targetId);
                    const iconOpen = this.querySelector('.icon-eye-open');
                    const iconClosed = this.querySelector('.icon-eye-closed');

                    if (targetInput) {
                        const isPassword = targetInput.getAttribute('type') === 'password';
                        if (isPassword) {
                            targetInput.setAttribute('type', 'text');
                            iconOpen.style.display = 'block';
                            iconClosed.style.display = 'none';
                        } else {
                            targetInput.setAttribute('type', 'password');
                            iconOpen.style.display = 'none';
                            iconClosed.style.display = 'block';
                        }
                    }
                });
            });

            // Máscara para DUI (00000000-0)
            if (inputDui) {
                inputDui.addEventListener('input', function(e) {
                    let valor = e.target.value.replace(/\D/g, '');
                    if (valor.length > 9) valor = valor.slice(0, 9);
                    if (valor.length > 8) {
                        e.target.value = valor.slice(0, 8) + '-' + valor.slice(8);
                    } else {
                        e.target.value = valor;
                    }
                });
            }

            // Máscara para Teléfono (0000-0000)
            if (inputTelefono) {
                inputTelefono.addEventListener('input', function(e) {
                    let valor = e.target.value.replace(/\D/g, '');
                    if (valor.length > 8) valor = valor.slice(0, 8);
                    if (valor.length > 4) {
                        e.target.value = valor.slice(0, 4) + '-' + valor.slice(4);
                    } else {
                        e.target.value = valor;
                    }
                });
            }

            // Envío con Fetch para Spinner continuo y SweetAlert de Éxito
            form.addEventListener('submit', function(e) {
                e.preventDefault();

                if (!form.checkValidity()) {
                    form.reportValidity();
                    return;
                }

                // Validación frontend de contraseñas coincidentes
                const pass = document.getElementById('inputPassword').value;
                const passConfirm = document.getElementById('inputPasswordConfirm').value;
                if (pass !== passConfirm) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'Contraseñas no coinciden',
                        text: 'Verifica que ambas contraseñas escritas sean exactamente iguales.',
                        confirmButtonColor: '#111827',
                        confirmButtonText: 'Revisar'
                    });
                    return;
                }

                // 1. Mostrar Spinner Inmediatamente
                Swal.fire({
                    title: 'Validando información',
                    text: 'Comprobando datos y verificando correo electrónico...',
                    allowOutsideClick: false,
                    allowEscapeKey: false,
                    showConfirmButton: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });

                // 2. Enviar petición por AJAX (Fetch)
                const formData = new FormData(form);

                fetch("{% url 'registro_responsable' %}", {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                })
                .then(response => response.json().then(data => ({ status: response.status, body: data })))
                .then(({ status, body }) => {
                    if (status === 200 && body.status === 'success') {
                        // 3. Spinner se transforma en alerta de Éxito
                        Swal.fire({
                            icon: 'success',
                            title: '¡Registro Exitoso!',
                            text: body.message,
                            confirmButtonColor: '#111827',
                            confirmButtonText: 'Iniciar Sesión',
                            allowOutsideClick: false
                        }).then((result) => {
                            if (result.isConfirmed) {
                                window.location.href = "{% url 'login' %}";
                            }
                        });
                    } else {
                        // Alerta de Error limpia en SweetAlert2
                        Swal.fire({
                            icon: 'error',
                            title: 'Atención',
                            text: body.message || 'Ocurrió un error inesperado.',
                            confirmButtonColor: '#111827',
                            confirmButtonText: 'Entendido'
                        });
                    }
                })
                .catch(error => {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error de Conexión',
                        text: 'No se pudo conectar con el servidor. Intenta de nuevo.',
                        confirmButtonColor: '#111827',
                        confirmButtonText: 'Aceptar'
                    });
                });
            });
        });
    </script>
</body>
</html>
