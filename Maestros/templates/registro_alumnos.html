{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'styles/control_alumnos.css' %}">
    <title>Registro alumnos</title>
</head>
<body>
    <main class="maestro-alumno">
        <section class="menu-opciones">
            <div class="imgContainer">
                    <img class="Logo" src="{% static 'logo.jpg' %}" alt="">
            </div>
           
            <div class="opciones">
                <ul>
                    <a href="{% url 'control_demeritos' %}" style="text-decoration:none;">
                        <li class="item-menu">
                            <i class="ti ti-demerito"></i> Demeritos
                        </li>
                    </a>
                    
                    <li class="item-menu activo">
                        <i class="ti ti-alumnos"></i> Alumnos
                    </li>
                </ul>
                <div class="cerrar-sesion-container">
                    <form action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button type="submit"class="btnCerrarSesion">cerrar sesión</button>
                    </form>
                </div>
            </div>
        </section>
        <section class="registro-alumno">
                <div class="container-titulo-alumno">
                    <h1 class="titulo-alumno">Registro de Alumnos</h1>
                    <a href="{% url 'control_alumnos' %}" class="btn-regresar" aria-label="Volver">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                    </a>
                </div>
                <form action="" id="formRegistroAlumno" data-url="{% url 'registro_alumnos' %}" data-redirect="{% url 'control_alumnos' %}">
                    {% csrf_token %}
                    <div class="registro-container-alumno">
                        <div class="registro-datos-alumno">
                            <div class="container-dato">
                                <label for="">Nombre:</label>
                                <input required class="input-dato" id="inputNombre" type="text" name="nombre">
                            </div>
                            <div class="container-dato">
                                <label for="">Apellido:</label>
                                <input required class="input-dato" id="inputApellido" type="text" name="apellido">
                            </div>
                            <div class="container-dato">
                                <label for="">Sexo:</label>
                                <div class="container-seleccion">
                                    <div class="seleccion-sexo">
                                        <label for="">Masculino: </label>
                                        <input   class="radio-sexo" input="inputMasculino" checked name="sexo" type="radio" value="M">
                                    </div>
    
                                    <div class="seleccion-sexo">
                                        <label for="">Femenino: </label>
                                        <input  class="radio-sexo" input="inputFemenino" name="sexo" type="radio" value="F">
                                    </div>             
                                </div>      
                            </div>
                            <div class="container-dato">
                                <label for="">NIE:</label>
                                <input required class="input-dato" type="text" name="nie" maxlength="8" id="inputNie" placeholder="00000000">
                                
                            </div>
                            <div class="container-dato">
                                <label for="">Grado:</label>
                                <select required class="input-dato" type="text" name="grado" id="inputGrado">
                                    <option value="" disabled selected>Seleccione...</option>
                                    <option value="0">Palvularia</option>
                                    <option value="1">1° Grado</option>
                                    <option value="2">2° Grado</option>
                                    <option value="3">3° Grado</option>
                                    <option value="4">4° Grado</option>
                                    <option value="5">5° Grado</option>
                                    <option value="6">6° Grado</option>
                                    <option value="7">7° Grado</option>
                                    <option value="8">8° Grado</option>
                                    <option value="9">9° Grado</option>
                                </select>
                                
                            </div>
                            <div class="container-dato">
                                <label for="">Sección:</label>
                                <select required class="input-dato" type="text" name="seccion" id="inputSeccion">
                                    <option value="" disabled selected>Seleccione...</option>
                                    <option value="A">Sección A</option>
                                    <option value="B">Sección B</option>
                                    <option value="C">Sección C</option>
                                </select>
                            </div>
                            <div class="container-dato">
                                <label for="">Fecha de nacimiento:</label>
                                <input required class="input-dato" type="date" name="fecha_nac" id="inputFechaNac"> 
                            </div>  
    
                        </div>
                        <div class="container-botones-alumno">
                            <button type="submit" class="btnRegistrarAlumno">Guardar Alumno</button>
                        </div>
                    </div>
                </form>
        </section>
    </main>
    <script src="{% static 'js/registrar_alumnos.js' %}"></script>
</body>
</html>
